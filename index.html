<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주웠다 찾았다 · AI 분실물 찾기 (시제품)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* ===== 웹코어 테마: 옛날 컴퓨터 바탕화면 위의 다이어리 홈페이지 (이미지 없이 CSS·SVG·이모지만 사용) ===== */
:root{
  --sky1:#3a6ea5;--sky2:#9cc9f5;--bar1:#0a246a;--bar2:#3a6ea5;--win:#ece9d8;--tab:#2b8ea8;--tabd:#1d6479;--hill:#3f9b2f;--red:#d9534f;--redt:#c0332f;--blue:#1c5fd4;
  --paper:#fffbea;--ink:#111;--pix:'Galmuri11','Galmuri9','Malgun Gothic',sans-serif;--body:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  --cur:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='24' viewBox='0 0 16 24' shape-rendering='crispEdges'><path d='M1 1v18l4-4 3 7 3-1-3-7h6z' fill='white' stroke='black' stroke-width='1.5'/></svg>") 1 1;
  --ico-w:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2 31 29H1z' fill='%23ffd21f' stroke='%23000' stroke-width='2' stroke-linejoin='round'/><rect x='14.5' y='11' width='3' height='9' fill='%23000'/><rect x='14.5' y='22' width='3' height='3' fill='%23000'/></svg>");
  --ico-q:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%233a6ea5' stroke='%23000' stroke-width='2'/><text x='16' y='23.5' font-size='21' font-weight='bold' text-anchor='middle' fill='%23fff' font-family='Arial,sans-serif'>?</text></svg>");
  --ico-ok:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2349b34a' stroke='%23000' stroke-width='2'/><path d='M8 16.5l6 6L24.5 10' fill='none' stroke='%23fff' stroke-width='4'/></svg>");
  --xicon:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'><rect width='18' height='18' fill='%23d9534f'/><path d='M5 5l8 8M13 5l-8 8' stroke='%23fff' stroke-width='2.4'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.5;cursor:var(--cur),default;
  background:
   radial-gradient(closest-side,#fff 55%,transparent) 14% 12%/170px 56px no-repeat,
   radial-gradient(closest-side,#fff 55%,transparent) 19% 9%/120px 64px no-repeat,
   radial-gradient(closest-side,#fff 55%,transparent) 9% 10%/110px 50px no-repeat,
   radial-gradient(closest-side,#fff 55%,transparent) 78% 26%/190px 58px no-repeat,
   radial-gradient(closest-side,#fff 55%,transparent) 84% 23%/130px 66px no-repeat,
   radial-gradient(closest-side,#fff 55%,transparent) 73% 24%/120px 52px no-repeat,
   radial-gradient(ellipse 50% 100% at 50% 100%,#4fb83c 98%,transparent 100%) -25% 100%/90% 36% no-repeat,
   radial-gradient(ellipse 50% 100% at 50% 100%,var(--hill) 98%,transparent 100%) 125% 100%/85% 28% no-repeat,
   linear-gradient(#3a6ea5,#7fb2e5 45%,#b9dcfa 75%,#d7ecff);
  background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:300;background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,textarea{cursor:text}
h1,h2,h3{font-weight:400}

/* ----- 바탕화면 / 다이어리 ----- */
#desk{max-width:1040px;margin:0 auto;padding:22px 14px 30px;display:flex;justify-content:center;align-items:flex-start}
#diary{position:relative;flex:1;min-width:0;max-width:880px;background:var(--paper);border:2px solid #7a5c3e;border-radius:12px;box-shadow:4px 5px 0 rgba(0,40,90,.35);
  background-image:linear-gradient(rgba(90,130,190,.12) 1px,transparent 1px);background-size:100% 26px}
#diary::before{content:"";position:absolute;inset:7px;border:2px dashed #c9a27a;border-radius:8px;pointer-events:none}
.topbar{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:16px 24px 8px;font-family:var(--pix)}
#counter{white-space:nowrap;font-size:13px;color:#333;justify-self:start;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:2px 8px}
#counter b{color:var(--redt)}
.svc{font-size:20px;font-weight:400;color:var(--bar1);text-shadow:1px 1px 0 #fff;margin:0;text-align:center}
#badge{justify-self:end;background:#ffeb7a;color:#5a4300;border:1px solid #8a6d00;padding:2px 8px;font-size:12px;font-family:var(--pix);white-space:nowrap}
.rings{position:absolute;z-index:3;display:flex;justify-content:space-around;pointer-events:none}
.rings i{display:block;width:34px;height:14px;border-radius:8px;background:linear-gradient(#f4f4f4,#8c8c8c);border:2px solid #4a4a4a;box-shadow:1px 2px 0 rgba(0,0,0,.3)}
#diary.spread .rings{left:50%;top:70px;bottom:36px;transform:translateX(-50%);flex-direction:column}
#diary.single .rings{left:-14px;top:70px;bottom:36px;flex-direction:column}
#diary.spread::after{content:"";position:absolute;left:50%;top:60px;bottom:14px;width:18px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(120,80,30,.14),transparent);pointer-events:none}
#app{position:relative;padding:8px 26px 30px;min-height:56vh;display:flex;flex-direction:column}
#diary.single #app{padding-left:36px}

/* ----- 탭 / 작업 표시줄 ----- */
#tabs{display:flex;flex-direction:column;gap:6px;margin:70px 0 0 -3px;z-index:2}
#tabs .tablist{display:flex;flex-direction:column;gap:6px}
#tabs .tab{font-family:var(--pix);font-size:15px;min-height:46px;padding:0 18px 0 14px;text-align:left;background:var(--tab);color:#fff;border:2px solid var(--tabd);border-left:none;border-radius:0 12px 12px 0;box-shadow:2px 2px 0 rgba(0,0,0,.25);white-space:nowrap}
#tabs .tab.on{background:#fff;color:var(--bar1);transform:translateX(5px);padding-right:24px;font-weight:700}
#tabs .tab .s,#tabs .start,#clock{display:none}

/* ----- 윈도우 / 버튼 공통 ----- */
.win{background:var(--win);border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px 0 #000,3px 3px 0 rgba(0,40,90,.25);padding:2px;color:var(--ink)}
.tb{display:flex;align-items:center;gap:6px;height:28px;padding:0 3px 0 8px;background:linear-gradient(90deg,var(--bar1),var(--bar2));color:#fff;font-family:var(--pix);font-size:13px}
.tb .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .x{width:22px;height:22px;flex:none;padding:0;border:2px solid;border-color:#fff #404040 #404040 #fff;background:var(--xicon) center/100% 100% no-repeat;font-size:0;color:transparent;min-height:0;display:block}
.wb{padding:12px}
.wb.np{padding:0}
.hand{background:var(--win);border:2px solid;border-color:#808080 #fff #fff #808080;padding:14px;box-shadow:inset 1px 1px 0 #404040}
.title{font-family:var(--pix);font-size:34px;line-height:1.2;margin:0;color:var(--bar1);text-shadow:2px 2px 0 #fff;text-align:center}
.title.sm{font-size:24px}
.pill,.chip,.back{background:var(--win);color:#000;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px 0 #808080,inset 1px 1px 0 #dfdfdf;border-radius:0}
.pill:active,.chip:active,.back:active,.chip.on{border-color:#404040 #fff #fff #404040;box-shadow:inset 1px 1px 0 #808080}
.pill{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:8px 16px;font-family:var(--pix);font-size:16px;outline:1px solid #000;outline-offset:0}
.pill.light{outline:none}
.pill .ar{color:var(--bar2);font-size:18px}
.pill.sm{width:auto;min-height:44px;padding:6px 16px;font-size:14px;display:inline-flex}
.pill[disabled]{opacity:.45;pointer-events:none}
.pill.center{justify-content:center}
.chip{min-height:36px;padding:3px 12px;font-size:14px}
.chip.on{font-weight:700;background:repeating-conic-gradient(#ece9d8 0 25%,#fff 0 50%) 0 0/4px 4px}
.back{min-height:44px;padding:4px 14px;font-size:14px;font-family:var(--pix)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1;min-width:0}
.hdr{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.hdr h2{margin:0;font-family:var(--pix);font-size:20px;color:var(--bar1)}
.steps{display:flex;gap:3px;margin:0 0 12px}
.steps i{flex:1;height:14px;border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff}
.steps i.on{background:var(--bar2)}
.steps i.now{background:repeating-linear-gradient(90deg,#1c4fb4 0 8px,transparent 8px 11px)}
label.f{display:block;margin-bottom:12px;font-size:14px}
label.f span{display:block;margin:0 0 4px 2px}
input[type=text],select,textarea{width:100%;min-height:44px;background:#fff;color:#000;border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px 0 #404040;border-radius:0;padding:8px 10px;font-family:var(--body);font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{outline:2px dotted #0a246a;outline-offset:1px}
textarea{resize:vertical;min-height:90px}
.note{font-size:13px;color:#444}
.tag{display:inline-block;background:#fff;border:1px solid #808080;padding:1px 9px;font-size:13px;margin:2px 4px 2px 0;color:#000}
button.tag{font-family:inherit;cursor:pointer;min-height:32px}
.tag.q{background:#eee;color:#666;border-style:dashed}
.st{font-family:var(--pix);font-size:13px;white-space:nowrap}
.st::before{content:"["}.st::after{content:"]"}
.st.s1{color:var(--redt)}.st.s2{color:var(--blue)}.st.s3{color:#555}

/* 레트로 대화상자 (.bubble = 안내문·AI 안내) */
.bubble{position:relative;display:block;width:100%;max-width:460px;margin:0 auto;text-align:left;background:var(--win);color:#000;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px 0 #000,3px 3px 0 rgba(0,40,90,.25);
  padding:38px 14px 14px 62px;min-height:84px;font-size:15px;line-height:1.5}
.bubble::before{content:var(--t,"알림");position:absolute;left:2px;right:2px;top:2px;height:26px;padding:0 8px;line-height:26px;font:13px/26px var(--pix);color:#fff;
  background:var(--xicon) right 3px center/20px 20px no-repeat,linear-gradient(90deg,var(--bar1),var(--bar2))}
.bubble::after{content:"";position:absolute;left:16px;top:42px;width:34px;height:34px;background:var(--ico-q) center/contain no-repeat}
.bubble.warn::after{background-image:var(--ico-w)}
.dlg{display:flex;gap:14px;align-items:flex-start;padding:16px}
.dlg .ico{flex:none;width:34px;height:34px;background:var(--ico-w) center/contain no-repeat}
.dlg .ico.q{background-image:var(--ico-q)}.dlg .ico.ok{background-image:var(--ico-ok)}
.dlg .dm{flex:1;min-width:0;font-size:15px}
.btns{display:flex;justify-content:center;gap:10px;padding:2px 12px 12px;flex-wrap:wrap}
.btns .pill{width:auto;min-width:96px;justify-content:center}
.pop{position:absolute;z-index:8;left:50%;top:70px;transform:translateX(-50%);width:min(340px,92%)}

/* 카메라 / 사진 */
.cam{position:relative;border:2px solid;border-color:#808080 #fff #fff #808080;overflow:hidden;background:#222;aspect-ratio:3/4;max-height:62vh;width:100%}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;inset:14% 12%;border:3px dashed rgba(255,255,255,.9);pointer-events:none}
.camMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.shutter{display:block;width:70px;height:70px;border-radius:50%;margin:10px auto 2px;background:radial-gradient(circle at 35% 30%,#ff9a95,var(--red) 60%,#a02724);border:3px solid;border-color:#fff #404040 #404040 #fff;box-shadow:0 0 0 3px var(--win),0 0 0 4px #404040}
.shutter:active{transform:scale(.93)}
.thumb{width:74px;height:74px;flex:none;border:2px solid;border-color:#808080 #fff #fff #808080;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:38px;background:#eee}
.thumb img{width:100%;height:100%;object-fit:cover}
.blur{filter:blur(9px);transform:scale(1.15)}
.thumb.big{width:100%;height:200px;font-size:90px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.radio{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sw{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sw button{width:60px;height:34px;border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;position:relative;padding:0;box-shadow:inset 1px 1px 0 #404040}
.sw button::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:var(--win);border:2px solid;border-color:#fff #404040 #404040 #fff;transition:.12s}
.sw button.on{background:var(--bar2)}.sw button.on::after{left:29px}

/* 진행 막대 */
.prog{height:26px;border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;padding:2px}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#1c4fb4 0 10px,transparent 10px 13px)}
.spin{position:relative;overflow:hidden;width:100%;max-width:280px;height:24px;margin:8px auto;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080}
.spin::after{content:"";position:absolute;top:2px;bottom:2px;width:64px;background:repeating-linear-gradient(90deg,#1c4fb4 0 10px,transparent 10px 13px);animation:mv 1.3s linear infinite}
@keyframes mv{from{left:-64px}to{left:100%}}

/* 메신저 채팅 */
.chat{display:flex;flex-direction:column;flex:1;min-height:0}
#msgs{display:flex;flex-direction:column;gap:12px;padding:10px;min-height:260px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px 0 #404040;margin-bottom:8px}
.m{max-width:92%;padding:0 8px;font-size:15px;word-break:keep-all;overflow-wrap:anywhere}
.m::before{display:block;font:12px/1.6 var(--pix);margin-bottom:1px}
.m.ai{align-self:flex-start;border-left:3px solid var(--tab)}
.m.ai::before{content:"AI도우미 님의 말:";color:var(--tabd)}
.m.me{align-self:flex-end;text-align:right;border-right:3px solid var(--red)}
.m.me::before{content:"나의 말:";color:var(--redt)}
.m.wide{max-width:100%;width:100%;border:none;padding:0;align-self:stretch;text-align:left}
.m.wide::before{display:none}
.cond{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.inbar{display:flex;gap:8px;position:sticky;bottom:0;background:var(--win);padding:6px 0 0}
.inbar input{flex:1}
.inbar .pill{width:auto}
.dots span{display:inline-block;animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.cand{position:relative;width:calc(100% - 24px);margin-bottom:12px}
.cand:nth-child(2){margin-left:12px;margin-top:-6px}
.cand:nth-child(3){margin-left:24px;margin-top:-6px}
.cand .wb{padding:10px 10px 14px}
.cand .thumb{width:92px;height:92px}
.cand h3{margin:0;font-size:16px;font-weight:700}
.cand .btns{justify-content:flex-start;padding:8px 0 0}
.cand .btns .pill{min-width:0;min-height:44px;padding:6px 14px;font-size:14px}

/* 폴더 창 (게시글 목록) */
.files{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px 0 #404040;max-height:60vh;overflow:auto}
.fhead,.card{display:grid;grid-template-columns:48px minmax(0,1.5fr) minmax(0,1.2fr) minmax(0,1fr) 78px;gap:8px;align-items:center}
.fhead{padding:3px 8px;font:12px var(--pix);background:var(--win);border-bottom:1px solid #808080;color:#222}
.card{width:100%;padding:6px 8px;background:#fff;border:none;border-bottom:1px dotted #aaa;border-radius:0;text-align:left;min-height:56px;font-size:14px}
.card:hover,.card:focus-visible{background:#dce8ff;outline:none}
.card .thumb{width:44px;height:44px;font-size:24px;grid-area:ic}
.card .nm{font-weight:700;grid-area:nm;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .pl{grid-area:pl;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .tm{grid-area:tm;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .st{grid-area:st}
.fhead,.card{grid-template-areas:"ic nm pl tm st"}
.fhead span:first-child{grid-column:1/3}

/* 홈 */
.spreadgrid{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1}
.pg.l{padding-right:30px;display:flex;flex-direction:column;gap:12px}
.pg.r{padding-left:30px;display:flex;flex-direction:column;gap:12px}
.mood{font-family:var(--pix);font-size:15px;margin-top:6px;background:#fff;border:1px dashed #808080;padding:4px 8px;display:inline-block}
.news{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px 0 #404040}
.news .nh{font:700 14px var(--pix);color:#fff;background:var(--tab);padding:3px 10px}
.nw{display:flex;gap:8px;align-items:center;width:100%;min-height:44px;padding:4px 10px;background:none;border:none;border-bottom:1px dotted #aaa;text-align:left;font-size:14px}
.nw:hover{background:#dce8ff}
.nw .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nw .nt{color:#555;font-size:12px;white-space:nowrap}
.center{text-align:center}
.hero{display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center;padding:16px 0}
.deco{font-size:46px;text-align:center;letter-spacing:8px}
a.lnk{color:var(--blue);text-decoration:underline;cursor:pointer}

/* 토스트(말풍선 알림) / 시트(창) */
#toast{position:fixed;right:16px;bottom:22px;transform:translateY(8px);background:#ffffe1;color:#000;border:1px solid #000;border-radius:6px;padding:10px 14px 10px 38px;z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:min(330px,90vw);font-size:14px;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
#toast::before{content:"💬";position:absolute;left:11px;top:9px}
#toast::after{content:"";position:absolute;right:26px;bottom:-8px;width:12px;height:12px;background:#ffffe1;border-right:1px solid #000;border-bottom:1px solid #000;transform:rotate(45deg)}
#toast.on{opacity:1;transform:none}
#sheet{position:fixed;inset:0;z-index:150;background:rgba(0,30,80,.38);display:none;align-items:center;justify-content:center;padding:12px}
#sheet.on{display:flex}
#sheet .in{width:100%;max-width:480px;max-height:90vh;overflow:auto}

/* ===== 휴대폰: 세로 탭 → 맨 아래 작업 표시줄 ===== */
@media(max-width:600px){
  body{padding-bottom:64px;font-size:15px}
  #desk{padding:10px 8px 10px}
  #diary{border-radius:8px}
  .topbar{grid-template-columns:1fr auto;padding:12px 14px 6px}
  .svc{grid-column:1/-1;order:-1;font-size:18px}
  #app,#diary.single #app{padding:6px 14px 22px 26px}
  #diary.spread .rings{left:-12px;transform:none;top:60px}
  #diary.spread::after{display:none}
  .spreadgrid{grid-template-columns:1fr}
  .pg.l,.pg.r{padding:0}
  .pg.l{margin-bottom:12px}
  .title{font-size:26px}
  #tabs{position:fixed;left:0;right:0;bottom:0;z-index:120;margin:0;height:50px;flex-direction:row;align-items:center;gap:4px;padding:4px 6px;background:var(--win);border-top:2px solid #fff;box-shadow:0 -1px 0 #808080}

/* --- 카메라 / 위치 --- */
function stopCamera(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}}
window.addEventListener('pagehide',stopCamera);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.screen==='found'&&S.found?.step==='camera')stopCamera()});
function startGeo(){
  const g=S.found.geo;if(g.status==='ok'||g.status==='pending')return;
  if(!navigator.geolocation){g.status='fail';return}
  g.status='pending';
  navigator.geolocation.getCurrentPosition(p=>{Object.assign(g,{status:'ok',lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)});geoUpdated()},
   e=>{g.status=e.code===1?'denied':'fail';geoUpdated()},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function geoUpdated(){if(S.screen==='found'&&S.found.step==='locate')render()}
async function startCamera(){
  stopCamera();startGeo();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){return camFail('이 주소에서는 카메라를 쓸 수 없어요. (https 또는 localhost에서만 켜져요)')}
  // 1순위: 후면 카메라 → 2순위: 아무 카메라 (노트북 웹캠 등)
  const tries=[{video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false},{video:true,audio:false}];
  let err=null;
  for(const c of tries){
    try{
      const st=await navigator.mediaDevices.getUserMedia(c);
      if(S.screen!=='found'||S.found.step!=='camera'){st.getTracks().forEach(t=>t.stop());return}
      S.stream=st;const v=$('#vid');v.srcObject=st;v.play().catch(()=>{});$('#camLoad')?.remove();
      $('#camErr').innerHTML='';$('#shot').style.display='';return;
    }catch(e){err=e;if(e&&e.name==='NotAllowedError')break}
  }
  if(S.screen!=='found'||S.found.step!=='camera')return;
  const n=err&&err.name;
  camFail(n==='NotAllowedError'?'카메라 권한이 꺼져 있어요. 주소창 왼쪽 🔒(또는 카메라 아이콘)을 눌러 "허용"으로 바꾼 뒤 다시 시도해 주세요.'
   :n==='NotFoundError'?'연결된 카메라를 찾지 못했어요. 웹캠이 연결돼 있는지 확인해 주세요.'
   :n==='NotReadableError'?'다른 프로그램(화상회의 등)이 카메라를 쓰고 있어요. 그 프로그램을 끄고 다시 시도해 주세요.'
   :'카메라를 켜지 못했어요. 다시 시도해 주세요.');
}
function camFail(msg){
  $('#camLoad')&&($('#camLoad').textContent='카메라가 꺼져 있어요');
  $('#shot')&&($('#shot').style.display='none');
  const touch=matchMedia('(pointer:coarse)').matches;   // 휴대폰만 기기 카메라 앱 대체 허용 (노트북은 탐색기가 열리므로 제외)
  const proto=location.protocol==='file:'?'<p class="note" style="margin:0 0 10px">⚠️ 파일을 직접 연 상태예요. <b>http://localhost:8000/index.html</b> 주소로 열어 주세요.</p>':'';
  $('#camErr').innerHTML=`<div class="hand center" style="margin:12px 0"><p style="margin:0 0 10px">${esc(msg)}</p>${proto}
   <button class="pill sm center" onclick="startCamera()">🔄 카메라 다시 켜기</button>
   ${touch?`<div style="height:8px"></div><label class="pill light sm center" style="cursor:pointer;display:inline-flex">📷 휴대폰 카메라 앱으로 찍기<input type="file" accept="image/*" capture="environment" hidden onchange="fromFile(this)"></label>`:''}</div>`;
}
function fromFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const img=new Image();img.onload=()=>{finishShot(img,img.naturalWidth,img.naturalHeight);URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f);
}
function shoot(){
  const v=$('#vid');if(!v||!v.videoWidth){toast('카메라가 아직 준비 중이에요');return}
  finishShot(v,v.videoWidth,v.videoHeight);
}
function finishShot(src,w,h){
  const k=Math.min(1,1280/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  const x=c.getContext('2d');x.drawImage(src,0,0,c.width,c.height);
  S.found.photo=c.toDataURL('image/jpeg',.85);S.found.takenAt=new Date();
  S.found.an.color=guessColor(c);
  stopCamera();
  if(S.screen!=='found')return;
  setStep('review');
}
function guessColor(c){
  try{const t=document.createElement('canvas');t.width=t.height=1;const x=t.getContext('2d');
   x.drawImage(c,c.width*.3,c.height*.3,c.width*.4,c.height*.4,0,0,1,1);const [r,g,b]=x.getImageData(0,0,1,1).data;
   const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/510,d=mx-mn;let s=d===0?0:d/(255-Math.abs(2*l*255-255));
   let h=0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}
   if(l<.2)return '검정';if(l>.82&&s<.5)return '흰색';if(s<.18)return l>.6?'흰색':'회색';
   if(h<15||h>=345)return '빨강';if(h<40)return l<.4?'갈색':'주황';if(h<65)return '노랑';if(h<160)return '초록';if(h<200)return '하늘색';if(h<255)return '파랑';if(h<290)return '보라';return '분홍';
  }catch(e){return '흰색'}
}

/* --- AI 사진 분석 (가짜) --- */
async function runAnalysis(){
  const F=S.found;F.step='analyzing';render();     // 잠깐 보이는 로딩 화면은 기록에 남기지 않음
  const msgs=['사진을 분석하는 중...','물건 종류를 알아보는 중...','시간과 장소를 정리하는 중...','AI가 글을 쓰고 있어요...'];
  const alive=()=>S.found===F&&S.screen==='found'&&F.step==='analyzing';
  for(let k=0;k<msgs.length;k++)for(let t=0;t<5;t++){    // 막대가 한 칸씩 차오름 (총 시간은 전과 같음)
    const pct=Math.round((k*5+t+1)/20*100),e=$('#anaMsg'),f=$('#progFill');
    if(e)e.textContent=`${msgs[k]} ${pct}%`;if(f)f.style.width=pct+'%';
    await wait(130);if(!alive())return;   // 로딩 중 뒤로 가기하면 중단
  }
  F.an={...DEMO_AN,features:[...DEMO_AN.features]};F.textEdited=false;F.catCustom=false;
  F.text=makeText();setStep('draft');
}

  let t=`${SCHOOL} ${loc}에서 ${dayWord(F.takenAt)} ${fmtTime(F.takenAt)}에 ${name}${josa(name,'을','를')} 주웠습니다.`;
  if(an.features.length)t+=` ${an.features.join(', ')}.`;
  if(F.memo)t+=` (${F.memo})`;
  return t;
}

 place:{도서관:['도서관','열람실'],학생회관:['학생회관','학회관'],본관:['본관'],체육관:['체육관','헬스'],기숙사:['기숙사','생활관'],학생식당:['학생식당','학식','식당','카페테리아'],정문:['정문','교문']},

// 한 문장에 여러 개가 나오면 '가장 뒤에 말한 것'을 고른다 (예: "에어팟 말고 지갑" → 지갑)
const pick=(map,t)=>{let best=null,pos=-1;for(const k in map)for(const w of map[k]){const p=t.lastIndexOf(w);if(p>pos){best=k;pos=p}}return best};
function parseTime(t){
  let day=null;
  if(/그저께|그제|이틀 전/.test(t))day=2;else if(/어제|어젯|엊그제/.test(t))day=1;else if(/오늘|아까|방금/.test(t))day=0;
  const m=t.match(/(\d+)\s*일\s*전/);if(m)day=+m[1];
  let part=null,from=null,to=null;
  if(/새벽/.test(t)){part='새벽';from=0;to=6}else if(/아침/.test(t)){part='아침';from=6;to=10}else if(/점심/.test(t)){part='점심쯤';from=11;to=14}
  else if(/오전/.test(t)){part='오전';from=6;to=12}else if(/오후/.test(t)){part='오후';from=12;to=18}else if(/저녁/.test(t)){part='저녁';from=17;to=21}else if(/밤/.test(t)){part='밤';from=20;to=24}
  if(day===null&&part===null)return null;
  return {day,part,from,to};
}
function timeLabel(t){
  if(!t)return '';let s='';
  if(t.day!==null){const d=ago(t.day,0,0);s+=fmtDate(d)}
  if(t.part)s+=(s?' ':'')+`${String(t.from).padStart(2,'0')}:00~${String(t.to).padStart(2,'0')}:00`;
  return s;
}
function initChat(){
  S.chat={cond:{cat:null,color:null,brand:null,place:null,time:null,feat:''},skipped:{},pending:null,asked:{},rounds:0,rejected:new Set(),stage:'collect',target:null,wrong:0,busy:false,started:false,extra:''};
}

   quick(['흰색 에어팟 잃어버렸어요','검정 우산','지갑을 잃어버렸어요','화장품 파우치'])}

function drawCond(){
  const c=S.chat.cond,sk=S.chat.skipped;
  const t=(l,v,k)=>v?`<button class="tag" onclick="clearCond('${k}')" title="눌러서 지우기">${l}: ${esc(v)} ✕</button>`:`<span class="tag ${sk[k]?'':'q'}">${l}: ${sk[k]?'모름':'?'}</span>`;
  $('#cond').innerHTML=`<span class="note" style="width:100%">🤖 AI가 뽑아낸 조건</span>${t('종류',c.cat,'cat')}${t('색상',c.color,'color')}${t('장소',c.place,'place')}${t('시간',timeLabel(c.time),'time')}${c.brand?t('브랜드',c.brand,'brand'):''}${c.feat?t('특징',c.feat,'feat'):''}`;

function clearCond(k){
  const C=S.chat;if(C.busy||C.stage==='verify'||C.stage==='done'||C.stage==='direct')return;
  const names={cat:'종류',color:'색상',place:'장소',time:'시간',brand:'브랜드',feat:'특징'};
  C.cond[k]=k==='feat'?'':null;delete C.skipped[k];if(k==='cat'||k==='feat'){C.extra=''}
  drawCond();aiSay(`${names[k]} 조건을 지웠어요. 바뀐 내용을 말씀해 주세요.`);

async function sendText(text){
  const C=S.chat;if(C.busy)return;
  add('me',esc(text));quick([]);C.busy=true;
  const typing=aiSay('<span class="dots"><span>●</span><span>●</span><span>●</span></span>');await wait(650);typing.remove();
  try{
    if(C.stage==='verify')await handleVerify(text);

    else if(C.stage==='done'||C.stage==='direct'){aiSay('이 대화는 끝났어요. 처음부터 다시 찾으려면 아래 버튼을 눌러 주세요.');quick(['다시 찾기'])}
    else await handleCollect(text);
  }finally{C.busy=false}
}
function extract(text){
  const C=S.chat,c=C.cond;const skip=KW.skip.some(w=>text.includes(w))&&text.length<22;
  const cat=pick(KW.cat,text),color=pick(KW.color,text),brand=pick(KW.brand,text),place=pick(KW.place,text),time=parseTime(text);
  // 대화 중에 말이 바뀌면 처음 값에 묶이지 않고 새 값으로 바꾼다
  if(!cat&&C.pending==='cat'&&!c.cat&&!skip&&!color&&!place&&!time&&text.trim().length>=2){c.cat='기타';delete C.skipped.cat}   // 어느 범주에도 안 맞으면 기타
  if(cat){if(c.cat&&c.cat!==cat){c.feat='';if(!brand)c.brand=null;C.extra='';C.rejected.clear();C.skipped.cat=false}c.cat=cat;delete C.skipped.cat}
  if(color){c.color=color;delete C.skipped.color}
  if(brand)c.brand=brand;
  if(place){c.place=place;delete C.skipped.place}
  if(time){c.time=time;delete C.skipped.time}
  if(/아니|말고|바꿀|정정|다시 생각|틀렸/.test(text)&&c.feat&&!cat){/* 특징 정정: 아래에서 새 특징으로 교체 */c._fix=true}
  const fw=['스티커','키링','줄','케이스','이름','흠집','각인','줄무늬','로고','고리','끈','캐릭터','잠금화면','배경'].filter(w=>text.includes(w));
  if(fw.length)c.feat=(c._fix?fw:[...new Set([...c.feat.split(' ').filter(Boolean),...fw])]).join(' ');
  delete c._fix;
  C.extra+=' '+text;
  if(skip&&C.pending&&!(cat||color||place||time))C.skipped[C.pending]=true;
  else if(C.pending&&C.pending!=='feat'&&C.pending!=='extra'&&!c[C.pending]&&!cat&&!color&&!place&&!time&&!fw.length&&!skip){C.skipped[C.pending]=true;if(C.pending==='place')C.noteUnknown='place'}
  if(C.pending==='feat'&&!fw.length&&!skip&&text.length>1){c.feat=text.slice(0,30)}
  drawCond();
}
async function handleCollect(text){
  const C=S.chat;
  if(C.stage==='extra'){extract(text);C.stage='collect';return doSearch()}
  extract(text);
  const c=C.cond;
  if(!c.cat){C.pending='cat';return aiSay('어떤 종류의 물건인가요? (예: 전자기기, 지갑·카드, 학용품, 화장품, 의류, 악세사리)'),quick(['전자기기','지갑·카드','학용품','화장품','의류','악세사리'])}
  if(!c.color&&!C.skipped.color){C.pending='color';return aiSay(`${esc(c.cat)}이군요. 색상은 어땠나요?`),quick(['흰색','검정','갈색','잘 기억 안 나요'])}
  if(!c.place&&!C.skipped.place){C.pending='place';return aiSay('어느 건물 근처에서 잃어버렸을까요?'),quick(['도서관','학생식당','학생회관','잘 모르겠어요'])}
  if(!c.time&&!C.skipped.time){C.pending='time';return aiSay('언제쯤 잃어버렸나요? (예: 어제 오후, 오늘 점심쯤)'),quick(['오늘 오전','어제 오후','잘 모르겠어요'])}
  if(!C.asked.feat&&!c.feat){C.asked.feat=true;C.pending='feat';return aiSay(`${c.cat==='전자기기'?'케이스에 스티커나 각인 같은 ':''}눈에 띄는 특징이 있었나요?`),quick(['스티커가 붙어 있어요','특징 없어요'])}
  C.pending=null;await doSearch();
}
function score(it,C){
  const c=C.cond;let s=0;
  if(c.color&&it.color===c.color)s+=3;
  if(c.place&&it.building===c.place)s+=3;
  if(c.brand&&it.brand===c.brand)s+=2;
  const txt=norm(C.extra);
  it.title.split(/\s+/).filter(w=>w.length>=2&&w!==it.color&&w!==it.brand).forEach(w=>{if(txt.includes(norm(w)))s+=2});   // 말한 물건 이름이 제목에 있으면 가점
  it.features.forEach(f=>{f.split(/\s+/).filter(w=>w.length>=2).forEach(w=>{if(txt.includes(norm(w)))s+=.5})});
  it.hiddenTags.forEach(w=>{if(txt.includes(norm(w)))s+=2});          // 숨긴 특징은 서버처럼 '점수 계산에만' 사용
  return s;
}
function search(){
  const C=S.chat,c=C.cond;
  let pool=S.items.filter(i=>i.status==='보관 중'&&!C.rejected.has(i.id));
  if(c.cat)pool=pool.filter(i=>effCat(i)===c.cat);
  let relaxed=false;
  const t=c.time;
  const byDate=pool.filter(i=>{
    if(!t)return true;
    if(t.day!==null&&dayDiff(i.found_at)!==t.day)return false;
    if(t.from!==null){const h=i.found_at.getHours()+i.found_at.getMinutes()/60;if(h<t.from-1||h>t.to+1)return false}
    return true;
  });
  if(byDate.length)pool=byDate;else if(t&&pool.length){relaxed=true}
  return {list:pool.map(i=>({i,s:score(i,C)})).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.i),relaxed};
}
async function doSearch(){
  const C=S.chat;C.rounds++;
  const m=aiSay('🔎 등록된 글을 비교하는 중… <span class="dots"><span>●</span><span>●</span><span>●</span></span>');await wait(1100);m.remove();
  const {list,relaxed}=search();
  C.shown=list;
  if(!list.length){
    if(C.rounds>=2)return toDirect('더 보여드릴 후보가 없어요.');
    C.stage='extra';aiSay('비슷한 물건을 찾지 못했어요 😢<br>브랜드, 모양, 크기 중 기억나는 게 있나요?'),quick(['작고 동그래요','브랜드는 모르겠어요']);return;
  }
  C.stage='show';
  aiSay(`비슷한 물건이 <b>${list.length}건</b> 있어요. 이것인가요?${relaxed?'<br><span class="note">날짜가 조금 달라도 비슷한 글을 찾았어요.</span>':''}`);
  const w=add('wide','');
  w.innerHTML=list.map((i,n)=>`<div class="cand">${win(`후보 ${n+1} - ${esc(i.title)}`,`<div class="wb"><div class="row" style="align-items:flex-start"><div class="thumb">${photoHTML(i,true)}</div>
   <div class="sp"><p class="note" style="margin:0;color:#222">📍 ${esc(loc(i))}<br>🕐 ${dayWord(i.found_at)} ${fmtTime(i.found_at)}</p></div></div>
   <div class="btns"><button class="pill" onclick="mine(${i.id})">이거예요</button><button class="pill light" onclick="rejectOne(this)">아니에요</button></div></div>`)}</div>`).join('')+
   `<button class="pill light center" onclick="notMine()">모두 아니에요</button><div class="note center" style="margin-top:6px">사진은 주인 확인 전까지 흐리게 보여요</div>`;
  scrollMsgs();
}
function rejectOne(btn){   // 후보 창 하나를 닫음. 전부 닫으면 '모두 아니에요'와 똑같이 처리
  const c=btn.closest('.cand');const w=c.parentNode;c.remove();
  if(!w.querySelector('.cand'))notMine();
}
async function notMine(){
  const C=S.chat;if(C.stage!=='show'||C.busy)return;
  add('me','모두 아니에요');C.shown.forEach(i=>C.rejected.add(i.id));C.stage='collect';
  await wait(500);
  if(C.rounds>=2)return toDirect('2번 찾아봤는데도 없었어요.');
  C.stage='extra';aiSay('아쉽네요. 조금만 더 알려주세요. 브랜드·모양·크기 중 기억나는 게 있나요?<br><span class="note">(예: 작고 동그란 케이스에 줄이 달려 있어요)</span>');quick(['케이스에 줄이 달려 있어요','작고 동그래요','기억 안 나요']);
}
function toDirect(msg){
  const C=S.chat;C.stage='direct';
  aiSay(`${msg} 😢<br>대화로는 한계가 있어서, <b>직접 검색</b>으로 안내해 드릴게요!`);
  const w=add('wide','');const cat=C.cond.cat||'';
  w.innerHTML=`<button class="pill" onclick="go('list',{list:{status:'보관 중',q:'',cat:'${cat}',bld:'',banner:'AI가 못 찾았어요. 직접 훑어보세요!'}})"><span>직접 검색하러 가기</span><span class="ar">➜</span></button>`;
}
function mine(id){
  const C=S.chat;if(C.stage!=='show'||C.busy)return;
  const it=S.items.find(x=>x.id===id);C.target=it;
  add('me',`"${esc(it.title)}" 이거예요!`);
  setTimeout(()=>{
    if(!it.verifyQ){C.stage='done';return connect(it,'이 글에는 확인 질문이 없어요.')}
    C.stage='verify';C.wrong=0;
    add('wide',dlg('확인 질문','q',`글쓴이가 남긴 확인 질문이에요 🔒<br><b>${esc(it.verifyQ)}</b><br><span class="note">아래 입력창에 답을 적어 주세요.</span>`));quick(['💡 시연용 정답 보기']);
  },500);
}
async function handleVerify(text){
  const C=S.chat,it=C.target;
  if(text.includes('시연용 정답')){aiSay(`(시연용) 정답은 <b>${esc(SECRETS[it.id]||'')}</b>이에요. 실제 서비스에서는 서버만 알고 있어요.`);return}
  const a=norm(text),b=norm(SECRETS[it.id]);
  if(a&&b&&(a.includes(b)||b.includes(a))){C.stage='done';return connect(it,'정답이에요! 🎉')}
  C.wrong++;
  aiSay(C.wrong>=2?'아직 아닌 것 같아요. 다시 생각해 보시거나 다른 글을 찾아볼까요?':'앗, 글쓴이가 적은 답과 달라요. 다시 입력해 주세요.');
  quick(['💡 시연용 정답 보기']);
}
function connect(it,msg){
  it.status='연락 중';
  aiSay(`${msg}<br>사진을 선명하게 보여드릴게요.`);
  const w=add('wide','');
  w.innerHTML=`<div class="cand" style="width:100%;margin-left:0">${win(`선택한 글 - ${esc(it.title)}`,`<div class="wb"><div class="thumb big" style="height:160px">${photoHTML(it)}</div><h3 style="margin:8px 0 2px">${esc(it.title)} <span class="st s2">연락 중</span></h3>
  <p class="note" style="margin:0">📍 ${esc(loc(it))} · 📦 ${esc(it.storage)}</p></div>`)}</div>
  <div class="bubble" style="margin:10px 0 14px">📮 글쓴이와 쪽지로 이어져요.<br><span class="note">쪽지는 로그인이 필요해요. (시제품에서는 여기까지 보여줘요)</span></div>
  <div class="stack"><button class="pill" onclick="go('list',{list:{status:'연락 중',q:'',cat:'',bld:'',banner:''}})"><span>목록에서 상태 보기</span><span class="ar">➜</span></button>
  <button class="pill light" onclick="go('home')"><span>처음으로</span><span class="ar">➜</span></button></div>`;
  scrollMsgs();
}

history.replaceState({screen:'home',step:null},'');   // 처음 열 때 home 상태를 기록에 넣음 (새 기록은 쌓지 않음)
render();
</script>
